name: Flutter Web CI

on:
  push:
    branches:
      - 'integracao/**'
      - HML
      - main
  pull_request:
    branches:
      - HML
      - main

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_projeto_semestre
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Web build
        run: flutter build web --release --dart-define=APP_ENV=hml --dart-define=API_BASE_URL=https://automatize-api-hml.onrender.com
