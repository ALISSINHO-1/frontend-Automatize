name: Validar integração dos PRs 13 14 e 15 na HML
on:
  push:
    branches: [validation/qa-completa-20261104]
    paths: ['.github/integration/**', '.github/workflows/integracao-hml.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: automatize_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d automatize_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      JWT_SECRET_KEY: chave-apenas-ci-build-descartavel-00000000000000000
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
      DEMO_ADMIN_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_TECNICO_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_CLIENTE_PASSWORD: SmokeBuild-Descartavel-2026
      VARIANT: admin-pr15
      REPORT_DIR: ${{ github.workspace }}/reports
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
      - uses: actions/checkout@v4
        with:
          ref: 3ec3ff0e9b9ad4ae97785bc90166ec05f585e9f8
          path: frontend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Análise, testes e build do conjunto
        working-directory: frontend/frontend_projeto_semestre
        run: |
          mkdir -p ../../reports
          flutter --version | tee ../../reports/flutter-version.txt
          flutter pub get
          flutter analyze | tee ../../reports/flutter-analyze.txt
          flutter test --reporter expanded | tee ../../reports/flutter-tests.txt
          flutter build web --release -t lib/main.dart --dart-define=API_BASE_URL=http://127.0.0.1:8000 | tee ../../reports/flutter-build.txt
          git rev-parse HEAD HEAD^{tree} > ../../reports/frontend-source.txt
      - uses: actions/checkout@v4
        with:
          repository: ALISSINHO-1/backend-Automatize
          ref: df6f3b4ea944e4082da196162a10f4b7dc44f5b5
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar API e banco descartável
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          python -m scripts.prepare_test_database
          alembic upgrade head
          python -m scripts.seed_demo_environment --apply
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../reports/api.log 2>&1 &
      - name: Testar jornadas da versão integrada no Chromium
        run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory frontend/frontend_projeto_semestre/build/web > reports/web.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for url in ('http://127.0.0.1:8000/health','http://127.0.0.1:8080'):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url,timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Servidor não iniciou: '+url)
          PY
          python validation/.github/integration/qa_paths.py
      - name: Evidências e build integrado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatize-hml-integrada
          path: |
            reports
            frontend/frontend_projeto_semestre/build/web
          retention-days: 7
