name: Validar builds e integracao Automatize
on:
  push:
    branches: [validation/build-20261104]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hml-oficial
            ref: fc1c2a66e28921550b98a95fce4c99c9fa1b5d33
            entry: lib/main.dart
          - name: admin-pr15
            ref: 87328f1df90341b2db60fca3cfcc06cbd39d6030
            entry: lib/main.dart
          - name: tecnico-pr16
            ref: 1f0cf1a920cbb5cdd03b56b62701ec9dae347f2d
            entry: lib/main_tecnico.dart
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: automatize_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d automatize_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      JWT_SECRET_KEY: chave-apenas-ci-build-descartavel-00000000000000000
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
      DEMO_ADMIN_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_TECNICO_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_CLIENTE_PASSWORD: SmokeBuild-Descartavel-2026
      VARIANT: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: ALISSINHO-1/backend-Automatize
          ref: df6f3b4ea944e4082da196162a10f4b7dc44f5b5
          path: backend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar relatorios
        run: mkdir -p reports
      - name: Dependencias Flutter
        working-directory: frontend/frontend_projeto_semestre
        run: |
          flutter --version | tee ../../reports/flutter-version.txt
          flutter pub get
      - name: Analise completa
        id: analyze
        continue-on-error: true
        working-directory: frontend/frontend_projeto_semestre
        run: flutter analyze 2>&1 | tee ../../reports/analyze.txt
      - name: Testes Flutter
        id: tests
        continue-on-error: true
        working-directory: frontend/frontend_projeto_semestre
        run: flutter test --reporter expanded 2>&1 | tee ../../reports/flutter-tests.txt
      - name: Build release
        id: build
        working-directory: frontend/frontend_projeto_semestre
        run: flutter build web --release -t ${{ matrix.entry }} --dart-define=API_BASE_URL=http://127.0.0.1:8000 2>&1 | tee ../../reports/build.txt
      - name: Build entrada oficial do PR16
        if: matrix.name == 'tecnico-pr16'
        working-directory: frontend/frontend_projeto_semestre
        run: |
          cp -a build/web ../../reports/web-tecnico
          flutter build web --release -t lib/main.dart --dart-define=API_BASE_URL=http://127.0.0.1:8000 2>&1 | tee ../../reports/build-oficial.txt
          cp -a build/web ../../reports/web-oficial
          cp -a ../../reports/web-tecnico/. build/web/
      - name: Preparar API e Chromium
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          python -m scripts.prepare_test_database
          alembic upgrade head
          python -m scripts.seed_demo_environment --apply
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../reports/api.log 2>&1 &
      - name: Servir build
        run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory frontend/frontend_projeto_semestre/build/web > reports/web-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ('http://127.0.0.1:8000/health','http://127.0.0.1:8080'):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url,timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Servidor nao iniciou: '+url)
          PY
      - name: Login e consultas reais no navegador
        id: smoke
        continue-on-error: true
        env:
          REPORT_DIR: ${{ github.workspace }}/reports
        run: python validation/.github/scripts/build_smoke.py
      - name: Publicar build e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatize-${{ matrix.name }}
          path: |
            reports
            frontend/frontend_projeto_semestre/build/web
          retention-days: 7
      - name: Resultado dos checks
        if: always()
        run: |
          test '${{ steps.analyze.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.smoke.outcome }}' = success
