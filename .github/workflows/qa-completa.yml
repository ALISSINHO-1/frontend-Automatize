name: QA completa de jornadas e API
on:
  push:
    branches: [validation/qa-completa-20261104]
    paths: ['.github/scripts/**', '.github/workflows/qa-completa.yml']
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  jornadas:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        name: [admin-pr15]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: automatize_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d automatize_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_only@localhost:5432/automatize_test
      JWT_SECRET_KEY: chave-apenas-ci-build-descartavel-00000000000000000
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
      DEMO_ADMIN_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_TECNICO_PASSWORD: SmokeBuild-Descartavel-2026
      DEMO_CLIENTE_PASSWORD: SmokeBuild-Descartavel-2026
      VARIANT: ${{ matrix.name }}
      QA_MODE: admin-filters
      REPORT_DIR: ${{ github.workspace }}/reports
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation
      - uses: actions/download-artifact@v4
        if: matrix.name != 'cliente-pr13' && matrix.name != 'api-completa'
        with:
          name: automatize-${{ matrix.name }}
          run-id: 41874462736
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/checkout@v4
        if: matrix.name == 'cliente-pr13'
        with:
          ref: 07412681c24e4d4d6c57277e5647206880456717
          path: previous
      - uses: subosito/flutter-action@v2
        if: matrix.name == 'cliente-pr13'
        with:
          channel: stable
          cache: true
      - name: Build e testes do PR cliente
        if: matrix.name == 'cliente-pr13'
        working-directory: previous/frontend_projeto_semestre
        run: |
          mkdir -p ../../reports
          flutter pub get
          flutter analyze
          flutter test --reporter expanded > ../../reports/flutter-tests.txt 2>&1
          flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8000
          mkdir -p ../frontend
          mv build ../frontend/build-temp
          mkdir -p ../frontend/frontend_projeto_semestre
          mv ../frontend/build-temp ../frontend/frontend_projeto_semestre/build
      - uses: actions/checkout@v4
        with:
          repository: ALISSINHO-1/backend-Automatize
          ref: df6f3b4ea944e4082da196162a10f4b7dc44f5b5
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar PostgreSQL e dependências
        working-directory: backend
        run: |
          mkdir -p ../reports
          python -m pip install -r requirements.txt playwright pytest-cov
          python -m scripts.prepare_test_database
          alembic upgrade head
      - name: Suíte completa API com cobertura de ramos
        if: matrix.name == 'api-completa'
        working-directory: backend
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/validation/.github/scripts:$GITHUB_WORKSPACE/backend" python -m pytest tests "$GITHUB_WORKSPACE/validation/.github/scripts/test_api_entrypoints.py" -p qa_route_coverage --junitxml=../reports/pytest.xml --cov=app --cov-branch --cov-report=term-missing --cov-report=json:../reports/coverage.json --cov-report=html:../reports/coverage-html -ra | tee ../reports/pytest.txt
          python - <<'PY'
          import json
          from app.main import app
          paths=app.openapi()['paths']
          inventory=[{'method':method.upper(),'path':path} for path,operations in paths.items() for method in operations if method in ('get','post','put','patch','delete')]
          open('../reports/rotas-api.json','w').write(json.dumps(inventory,ensure_ascii=False,indent=2))
          PY
      - name: Iniciar API e navegador
        if: matrix.name != 'api-completa'
        working-directory: backend
        run: |
          python -m playwright install --with-deps chromium
          python -m scripts.seed_demo_environment --apply
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../reports/api.log 2>&1 &
      - name: Servir e testar todas as jornadas
        if: matrix.name != 'api-completa'
        run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory previous/frontend/frontend_projeto_semestre/build/web > reports/web-server.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for url in ('http://127.0.0.1:8000/health','http://127.0.0.1:8080'):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url,timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Servidor nao iniciou: '+url)
          PY
          python validation/.github/scripts/qa_paths.py
      - name: Evidências e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-completa-${{ matrix.name }}
          path: reports
          retention-days: 7
